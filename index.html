<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galerie</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#faf6ef;--card:#fff;--oak:#b07d4f;--walnut:#5b3a24;--beige:#ecdfcc;--text:#3d2b1f}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;line-height:1.5}
header{text-align:center;padding:72px 20px 36px;background:linear-gradient(180deg,#f3e8d8,var(--bg))}
h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:clamp(2rem,5vw,3.2rem);color:var(--walnut)}
header .line{width:64px;height:3px;background:var(--oak);border-radius:2px;margin:18px auto 0}
main{max-width:1200px;margin:0 auto;padding:0 20px 40px}
section.card{margin-top:32px;background:#fffdf9;border:1px solid #efe4d3;border-radius:22px;padding:24px 0 22px;box-shadow:0 8px 28px rgba(91,58,36,.08)}
.head{display:flex;align-items:center;gap:14px;padding:0 26px 16px}
h2{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:1.6rem;color:var(--walnut)}
.count{font-size:.8rem;color:#9a7f68;background:var(--beige);padding:3px 11px;border-radius:20px}
.nav{margin-left:auto;display:flex;gap:8px}
.arr{width:40px;height:40px;border-radius:50%;border:1px solid #e3d3bd;background:#fff;color:var(--walnut);font-size:1.4rem;cursor:pointer;transition:background .2s,color .2s}
.arr:hover{background:var(--oak);color:#fff;border-color:var(--oak)}
.gallery{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 26px;padding:6px 26px 14px;scrollbar-width:thin;scrollbar-color:#d9c4a6 transparent;-webkit-overflow-scrolling:touch}
.gallery img{height:340px;width:auto;flex:none;scroll-snap-align:start;display:block;border-radius:14px;cursor:zoom-in;box-shadow:0 6px 18px rgba(91,58,36,.14);transition:transform .35s ease,box-shadow .35s ease,opacity .7s ease;background:var(--beige)}
.gallery img:hover{transform:scale(1.025);box-shadow:0 12px 28px rgba(91,58,36,.22)}
.fade{opacity:0;transform:translateY(16px)}
.fade.in{opacity:1;transform:none}
footer{text-align:center;padding:36px 20px 44px;color:#9a7f68;font-size:.85rem;border-top:1px solid var(--beige);margin-top:40px}
#lb{position:fixed;inset:0;background:rgba(40,26,16,.92);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s;z-index:10}
#lb.open{opacity:1;pointer-events:auto}
#lb img{max-width:88vw;max-height:84vh;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#lb button{position:absolute;background:rgba(250,246,239,.15);color:#faf6ef;border:0;width:52px;height:52px;border-radius:50%;font-size:1.6rem;cursor:pointer;transition:background .2s}
#lb button:hover{background:rgba(250,246,239,.3)}
#prev{left:20px}#next{right:20px}#close{top:20px;right:20px}
#count{position:absolute;bottom:22px;color:#e8dccb;font-size:.9rem;letter-spacing:.1em}
@media(max-width:600px){.gallery img{height:240px;border-radius:10px}.nav{display:none}.head{padding:0 18px 12px}.gallery{padding:4px 18px 12px}h2{font-size:1.3rem}section.card{border-radius:16px}#lb button{width:42px;height:42px}#prev{left:8px}#next{right:8px}}
</style>
</head>
<body>
<header><h1>Galerie</h1><div class="line"></div></header>

<!-- BILDER AUSTAUSCHEN: Fotos in den Ordner "images/" legen und unten
     die Dateinamen anpassen. Für ein weiteres Bild einfach eine Zeile
     <img src="images/DATEINAME.jpg" alt="" loading="lazy"> in die passende
     Gruppe einfügen. Neue Gruppe = neuen <section>-Block kopieren. -->
<main>
<section class="card">
  <div class="head"><h2>Waschtisch</h2><span class="count">6 Fotos</span>
    <div class="nav"><button class="arr" data-d="-1" aria-label="Zurück">&#8249;</button><button class="arr" data-d="1" aria-label="Weiter">&#8250;</button></div></div>
  <div class="gallery">
    <img src="images/waschtisch-1.jpg" alt="Waschtisch 1" loading="lazy">
    <img src="images/waschtisch-2.jpg" alt="Waschtisch 2" loading="lazy">
    <img src="images/waschtisch-3.jpg" alt="Waschtisch 3" loading="lazy">
    <img src="images/waschtisch-4.jpg" alt="Waschtisch 4" loading="lazy">
    <img src="images/waschtisch-5.jpg" alt="Waschtisch 5" loading="lazy">
    <img src="images/waschtisch-6.jpg" alt="Waschtisch 6" loading="lazy">
  </div>
</section>
<section class="card">
  <div class="head"><h2>Spiegelschrank</h2><span class="count">4 Fotos</span>
    <div class="nav"><button class="arr" data-d="-1" aria-label="Zurück">&#8249;</button><button class="arr" data-d="1" aria-label="Weiter">&#8250;</button></div></div>
  <div class="gallery">
    <img src="images/spiegelschrank-1.jpg" alt="Spiegelschrank 1" loading="lazy">
    <img src="images/spiegelschrank-2.jpg" alt="Spiegelschrank 2" loading="lazy">
    <img src="images/spiegelschrank-3.jpg" alt="Spiegelschrank 3" loading="lazy">
    <img src="images/spiegelschrank-4.jpg" alt="Spiegelschrank 4" loading="lazy">
  </div>
</section>
<section class="card">
  <div class="head"><h2>Etagenbett</h2><span class="count">5 Fotos</span>
    <div class="nav"><button class="arr" data-d="-1" aria-label="Zurück">&#8249;</button><button class="arr" data-d="1" aria-label="Weiter">&#8250;</button></div></div>
  <div class="gallery">
    <img src="images/etagenbett-1.jpg" alt="Etagenbett 1" loading="lazy">
    <img src="images/etagenbett-2.jpg" alt="Etagenbett 2" loading="lazy">
    <img src="images/etagenbett-3.jpg" alt="Etagenbett 3" loading="lazy">
    <img src="images/etagenbett-4.jpg" alt="Etagenbett 4" loading="lazy">
    <img src="images/etagenbett-5.jpg" alt="Etagenbett 5" loading="lazy">
  </div>
</section>
<section class="card">
  <div class="head"><h2>Kleiderschrank</h2><span class="count">4 Fotos</span>
    <div class="nav"><button class="arr" data-d="-1" aria-label="Zurück">&#8249;</button><button class="arr" data-d="1" aria-label="Weiter">&#8250;</button></div></div>
  <div class="gallery">
    <img src="images/kleiderschrank-1.jpg" alt="Kleiderschrank 1" loading="lazy">
    <img src="images/kleiderschrank-2.jpg" alt="Kleiderschrank 2" loading="lazy">
    <img src="images/kleiderschrank-3.jpg" alt="Kleiderschrank 3" loading="lazy">
    <img src="images/kleiderschrank-4.jpg" alt="Kleiderschrank 4" loading="lazy">
  </div>
</section>
<section class="card">
  <div class="head"><h2>Gardinenschienen</h2><span class="count">6 Fotos</span>
    <div class="nav"><button class="arr" data-d="-1" aria-label="Zurück">&#8249;</button><button class="arr" data-d="1" aria-label="Weiter">&#8250;</button></div></div>
  <div class="gallery">
    <img src="images/gardinenschienen-1.jpg" alt="Gardinenschienen 1" loading="lazy">
    <img src="images/gardinenschienen-2.jpg" alt="Gardinenschienen 2" loading="lazy">
    <img src="images/gardinenschienen-3.jpg" alt="Gardinenschienen 3" loading="lazy">
    <img src="images/gardinenschienen-4.jpg" alt="Gardinenschienen 4" loading="lazy">
    <img src="images/gardinenschienen-5.jpg" alt="Gardinenschienen 5" loading="lazy">
    <img src="images/gardinenschienen-6.jpg" alt="Gardinenschienen 6" loading="lazy">
  </div>
</section>
</main>

<footer>Montage &amp; Aufbau mit Sorgfalt</footer>

<div id="lb" role="dialog" aria-label="Bildansicht">
  <button id="close" aria-label="Schließen">&times;</button>
  <button id="prev" aria-label="Vorheriges Bild">&#8249;</button>
  <img id="lbimg" alt="">
  <button id="next" aria-label="Nächstes Bild">&#8250;</button>
  <div id="count"></div>
</div>
<script>
const imgs=[...document.querySelectorAll('.gallery img')],lb=document.getElementById('lb'),li=document.getElementById('lbimg'),ct=document.getElementById('count');let cur=0;
function show(i){cur=(i+imgs.length)%imgs.length;li.src=imgs[cur].src;li.alt=imgs[cur].alt;ct.textContent=(cur+1)+' / '+imgs.length;lb.classList.add('open')}
const close=()=>lb.classList.remove('open');
imgs.forEach((im,i)=>{im.onclick=()=>show(i);im.classList.add('fade')});
document.getElementById('prev').onclick=e=>{e.stopPropagation();show(cur-1)};
document.getElementById('next').onclick=e=>{e.stopPropagation();show(cur+1)};
document.getElementById('close').onclick=close;li.onclick=e=>e.stopPropagation();lb.onclick=close;
document.onkeydown=e=>{if(!lb.classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')show(cur-1);if(e.key==='ArrowRight')show(cur+1)};
const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target)}}),{threshold:.1,root:null,rootMargin:'0px 400px'});
imgs.forEach(im=>io.observe(im));
document.querySelectorAll('.arr').forEach(b=>b.onclick=()=>{const g=b.closest('.card').querySelector('.gallery');g.scrollBy({left:b.dataset.d*g.clientWidth*.8,behavior:'smooth'})});
</script>
</body>
</html>
